<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<title>影片逐字稿收藏</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E5%BD%B1%E7%89%87%E9%80%90%E5%AD%97%E7%A8%BF%E6%94%B6%E8%97%8F%22%2C%22short_name%22%3A%22%E9%80%90%E5%AD%97%E7%A8%BF%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231F4E79%22%2C%22theme_color%22%3A%22%231F4E79%22%2C%22share_target%22%3A%7B%22action%22%3A%22.%2F%22%2C%22method%22%3A%22GET%22%2C%22params%22%3A%7B%22title%22%3A%22title%22%2C%22text%22%3A%22text%22%2C%22url%22%3A%22url%22%7D%7D%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg%2522%2520viewBox%253D%25220%25200%2520192%2520192%2522%253E%253Crect%2520width%253D%2522192%2522%2520height%253D%2522192%2522%2520rx%253D%252236%2522%2520fill%253D%2522%25231F4E79%2522%252F%253E%253Cpath%2520d%253D%2522M76%252064l52%252032-52%252032z%2522%2520fill%253D%2522%2523C8A04D%2522%252F%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%22%7D%5D%7D">
<style>
  :root{
    --navy:#1F4E79; --navy-d:#163a5c; --gold:#C8A04D; --gold-l:#dcbd76;
    --bg:#0f1a26; --card:#16263a; --card-2:#1d3145; --line:#2a3f56;
    --txt:#e8eef5; --txt-dim:#9fb1c6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Microsoft JhengHei","微軟正黑體",-apple-system,system-ui,sans-serif;
    background:var(--bg);color:var(--txt);padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--navy),var(--navy-d));
    padding:calc(16px + env(safe-area-inset-top)) 18px 16px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
  header h1{margin:0;font-size:19px;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
  header h1 .dot{width:11px;height:11px;border-radius:3px;background:var(--gold)}
  header p{margin:5px 0 0 20px;font-size:12px;color:#bcd0e6}
  .wrap{padding:16px;max-width:680px;margin:0 auto}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .panel h2{margin:0 0 12px;font-size:14px;color:var(--gold-l);font-weight:600;display:flex;align-items:center;gap:7px}
  label{font-size:12px;color:var(--txt-dim);display:block;margin-bottom:5px}
  input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
    color:var(--txt);padding:11px 12px;font-size:14px;font-family:inherit;margin-bottom:11px}
  input:focus,textarea:focus{outline:none;border-color:var(--gold)}
  textarea{resize:vertical;min-height:54px}
  .btn{background:var(--gold);color:#1a1205;border:none;border-radius:9px;padding:12px 14px;
    font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;width:100%}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:transparent;color:var(--gold-l);border:1px solid var(--gold)}
  .preview{background:var(--card-2);border-radius:9px;padding:11px;margin-bottom:11px;font-size:13px;
    display:none;border-left:3px solid var(--gold)}
  .preview.show{display:block}
  .preview .vid{color:var(--txt-dim);font-size:11px;margin-top:3px;word-break:break-all}
  .svc-title{font-size:12px;color:var(--txt-dim);margin:14px 0 8px}
  .svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .svc{background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:11px 10px;
    text-decoration:none;color:var(--txt);font-size:13px;text-align:center;display:block;position:relative}
  .svc:active{border-color:var(--gold)}
  .svc .tag{display:block;font-size:10px;margin-top:3px}
  .svc .tag.ai{color:var(--gold-l)} .svc .tag.cc{color:#7fc8a0}
  .empty{text-align:center;color:var(--txt-dim);font-size:13px;padding:30px 10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:11px}
  .item .t{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.4}
  .item .meta{font-size:11px;color:var(--txt-dim);margin-bottom:8px}
  .item .note{font-size:13px;color:#cdd9e6;background:var(--card-2);border-radius:7px;padding:8px;margin:8px 0;white-space:pre-wrap}
  .item .row{display:flex;gap:8px;flex-wrap:wrap}
  .item .row a,.item .row button{flex:1;min-width:90px;font-size:12px;padding:9px;border-radius:8px;
    text-decoration:none;text-align:center;border:1px solid var(--line);background:var(--card-2);
    color:var(--txt);cursor:pointer;font-family:inherit}
  .item .row a.go{background:var(--gold);color:#1a1205;border:none;font-weight:700}
  .item .row button.del{color:#e08;border-color:#5a2238}
  .count{font-size:11px;color:var(--txt-dim);font-weight:400}
  .tip{font-size:11px;color:var(--txt-dim);line-height:1.6;margin-top:4px}
  .tip b{color:var(--gold-l)}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>影片逐字稿收藏</h1>
  <p>分享 → 一鍵轉錄 → 存檔閱讀</p>
</header>

<div class="wrap">
  <div class="panel">
    <h2>➕ 新增影片</h2>
    <label>YouTube 連結（從 App 分享進來會自動填入）</label>
    <input id="url" placeholder="貼上 https://youtu.be/...">
    <div class="preview" id="preview">
      <div id="pvTitle">已辨識影片</div>
      <div class="vid" id="pvId"></div>
    </div>
    <label>標題（選填）</label>
    <input id="title" placeholder="影片標題">
    <label>備註 / 標籤（選填）</label>
    <textarea id="note" placeholder="例：AI工具 / 電梯技術 / 重點是…"></textarea>
    <button class="btn" onclick="save()">存入收藏</button>

    <div class="svc-title">取得逐字稿 — 點任一服務（新分頁開啟，自動帶網址）</div>
    <div class="svc-grid" id="svcGrid"></div>
    <div class="tip"><b>CC</b>＝讀現成字幕（快）　<b>AI</b>＝沒字幕也能從音訊辨識。<br>沒字幕的影片，優先點 AI 那幾家。</div>
  </div>

  <div class="panel">
    <h2>📚 我的收藏 <span class="count" id="count"></span></h2>
    <div id="list"></div>
  </div>
</div>

<script>
const SERVICES = [
  {name:"WayinVideo", url:"https://wayin.ai/tools/video-transcript-generator/youtube/", type:"ai"},
  {name:"Choppity",   url:"https://www.choppity.com/tools/youtube-video-to-transcript/", type:"ai"},
  {name:"NoteGPT",    url:"https://notegpt.io/youtube-transcript-generator", type:"ai"},
  {name:"YT-Transcript", url:"https://youtubetotranscript.com/", type:"cc"},
  {name:"Tactiq",     url:"https://tactiq.io/tools/youtube-transcript", type:"cc"},
  {name:"Maestra",    url:"https://maestra.ai/tools/video-to-text/youtube-transcript-generator", type:"ai"},
];
const KEY="ytTranscriptCollection";
const $=id=>document.getElementById(id);

function parseId(u){
  if(!u) return null;
  const m=u.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
  return m?m[1]:null;
}
function cleanUrl(u){const id=parseId(u);return id?("https://www.youtube.com/watch?v="+id):u;}

function refreshPreview(){
  const id=parseId($("url").value);
  if(id){$("preview").classList.add("show");$("pvId").textContent="影片 ID："+id;}
  else $("preview").classList.remove("show");
}
$("url").addEventListener("input",refreshPreview);

function buildServices(){
  const u=$("url").value.trim();
  const link=u?cleanUrl(u):"";
  $("svcGrid").innerHTML=SERVICES.map(s=>{
    const href=link?(s.url+"#"+encodeURIComponent(link)):s.url;
    const tag=s.type==="ai"?'<span class="tag ai">AI 音訊</span>':'<span class="tag cc">讀字幕</span>';
    return `<a class="svc" target="_blank" rel="noopener" href="${href}"
      onclick="copyUrl('${link}')">${s.name}${tag}</a>`;
  }).join("");
}
function copyUrl(u){ if(u&&navigator.clipboard) navigator.clipboard.writeText(u).catch(()=>{}); }
$("url").addEventListener("input",buildServices);

function load(){return JSON.parse(localStorage.getItem(KEY)||"[]");}
function store(a){localStorage.setItem(KEY,JSON.stringify(a));}

function save(){
  const url=$("url").value.trim();
  const id=parseId(url);
  if(!id){alert("請貼上有效的 YouTube 連結");return;}
  const arr=load();
  arr.unshift({
    id, url:cleanUrl(url),
    title:$("title").value.trim()||"未命名影片",
    note:$("note").value.trim(),
    ts:Date.now()
  });
  store(arr);
  $("url").value="";$("title").value="";$("note").value="";
  refreshPreview();buildServices();render();
}

function del(i){const arr=load();arr.splice(i,1);store(arr);render();}

function svcLink(url){
  return SERVICES.map(s=>{
    const href=s.url+"#"+encodeURIComponent(url);
    return `<a class="go" target="_blank" rel="noopener" href="${href}"
      onclick="navigator.clipboard&&navigator.clipboard.writeText('${url}')">${s.name}</a>`;
  }).join("");
}

function render(){
  const arr=load();
  $("count").textContent=arr.length?`（${arr.length} 部）`:"";
  if(!arr.length){$("list").innerHTML='<div class="empty">還沒有收藏。<br>從 YouTube App 分享，或在上方貼連結。</div>';return;}
  $("list").innerHTML=arr.map((v,i)=>{
    const d=new Date(v.ts);
    const ds=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    const note=v.note?`<div class="note">${esc(v.note)}</div>`:"";
    return `<div class="item">
      <div class="t">${esc(v.title)}</div>
      <div class="meta">${ds}　·　${v.id}</div>
      ${note}
      <div class="row">
        <a class="go" target="_blank" rel="noopener" href="https://wayin.ai/tools/video-transcript-generator/youtube/#${encodeURIComponent(v.url)}" onclick="navigator.clipboard&&navigator.clipboard.writeText('${v.url}')">取逐字稿(AI)</a>
        <a href="${v.url}" target="_blank" rel="noopener">看影片</a>
        <button class="del" onclick="del(${i})">刪除</button>
      </div>
    </div>`;
  }).join("");
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// 接收分享進來的資料
(function(){
  const p=new URLSearchParams(location.search);
  const shared=p.get("url")||p.get("text")||"";
  const sTitle=p.get("title")||"";
  if(shared){
    const found=shared.match(/https?:\/\/[^\s]+/);
    if(found){$("url").value=found[0];refreshPreview();buildServices();}
  }
  if(sTitle) $("title").value=sTitle;
})();

buildServices();render();

// 簡易 service worker（讓它可離線開啟清單、可安裝）
if("serviceWorker" in navigator){
  const sw=`self.addEventListener("install",e=>self.skipWaiting());
  self.addEventListener("activate",e=>self.clients.claim());
  self.addEventListener("fetch",e=>{});`;
  const blob=new Blob([sw],{type:"text/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
